---
name: CI-Copr
permissions: {}

on:
  workflow_call:
    secrets:
      COPR_BETA_WEBHOOK_TOKEN:
        required: false
      COPR_STABLE_WEBHOOK_TOKEN:
        required: false
      COPR_CLI_CONFIG:
        required: false
      GH_BOT_TOKEN:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false

jobs:
  organization:
    uses: LizardByte/.github/.github/workflows/__call-organization.yml@master

  call-copr-ci:
    needs: organization
    if: needs.organization.outputs.allowed == 'true'
    permissions:
      contents: read
    uses: LizardByte/copr-ci/.github/workflows/copr-ci.yml@master
    with:
      copr_pr_webhook_token: "05fc9b07-a19b-4f83-89b2-ae1e7e0b5282"
      github_org_owner: ${{ github.repository_owner }}
      copr_ownername: lizardbyte
      auto_update_package: true
      job_timeout: 90
    secrets:
      COPR_BETA_WEBHOOK_TOKEN: ${{ secrets.COPR_BETA_WEBHOOK_TOKEN }}
      COPR_STABLE_WEBHOOK_TOKEN: ${{ secrets.COPR_STABLE_WEBHOOK_TOKEN }}
      COPR_CLI_CONFIG: ${{ secrets.COPR_CLI_CONFIG }}

  release:
    name: Release
    if:
      github.event_name == 'release' &&
      needs.organization.outputs.allowed == 'true' &&
      github.event.release.prerelease == true
    needs:
      - organization
      - call-copr-ci
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Debug artifacts
        run: ls -l artifacts

      - name: Update GitHub Release
        uses: LizardByte/actions/actions/release_create@5cffab388578559f85fa83c6f7bfff244e06600d  # v2026.1108.210022
        with:
          allowUpdates: true
          body: ${{ github.event.release.body }}
          deleteOtherPreReleases: false
          generateReleaseNotes: false
          name: ${{ github.event.release.name }}
          prerelease: true
          tag: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}  # use built-in token to avoid repeating workflow triggers
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
